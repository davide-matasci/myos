[workspace]

[package]
name = "virtio_blk"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "virtio-blk kernel module: /dev/vd* over PCI legacy I/O (x86_64) or virtio-mmio (aarch64, riscv64)."

[[bin]]
name = "virtio_blk"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }
virtq = { path = "../virtq" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
