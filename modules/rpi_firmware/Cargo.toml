[workspace]

[package]
name = "rpi_firmware"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Raspberry Pi firmware kernel module: the VideoCore mailbox property interface (power domains, clocks) as a service."

[[bin]]
name = "rpi_firmware"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
