[workspace]

[package]
name = "usb_hid"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "USB HID class driver module: mice and tablets, into the console's pointer (/dev/console/mouse)."

[[bin]]
name = "usb_hid"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
