[workspace]

[package]
name = "usbdev"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "/dev/usb: the USB interfaces no kernel driver claims, for drivers that run as programs (control and bulk transfers through files)."

[[bin]]
name = "usbdev"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
