[workspace]

[package]
name = "ohci"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "OHCI (USB 1.1) host controller driver kernel module: full- and low-speed devices (alone, or an EHCI's companion), registered with the usb module (the USB core)."

[[bin]]
name = "ohci"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
