[workspace]

[package]
name = "acpi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Minimal ACPI table parse + AML interpreter; publishes /proc/acpi/*."

[[bin]]
name = "acpi"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

# The AML interpreter (`aml.rs`): x86_64 only, the arch whose firmware
# hands over ACPI tables with routes and power methods in them.
[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = "=6.1.1"

# With myos's patches (crate/*.myos.patch): crate/prepare.sh lays it out
# in target/acpi-myos before kernel/build.rs builds the module.
[patch.crates-io]
acpi = { path = "../../target/acpi-myos" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
