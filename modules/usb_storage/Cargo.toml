[workspace]

[package]
name = "usb_storage"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "USB mass storage class driver module (bulk-only transport, SCSI): /dev/sdX/ through the xhci module's USB bus service."

[[bin]]
name = "usb_storage"
test = false
bench = false

[dependencies]
myos-abi = { path = "../abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
