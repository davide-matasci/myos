name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Daily full-boot test run (the boot jobs only run here or on manual
    # dispatch with the full_boot flag; every other run gets boot-mini).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      full_boot:
        description: Run the full boot jobs (http/curl smokes included)
        type: boolean
        default: false
      probe_latest_nightly:
        description: Also test wire-myos against latest nightly (non-blocking)
        type: boolean
        default: false
      force_sysroot:
        description: Force sysroot rebuild and artifact upload (even if std paths unchanged)
        type: boolean
        default: false
      build_iso:
        description: Build a distributable x86_64 hybrid ISO from the build job's outputs (manual only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  CARGO_TERM_COLOR: always

# CRITICAL: GitHub defaults `run` steps inside a `container:` job to `sh`
# instead of `bash`. Every multi-line run block below uses bashisms (`[[ ]]`,
# arrays, `shopt`) — most importantly the `if [[ "1" == "1" ]]` gate that
# must reach ./toolchain/std/fetch-sysroot.sh in ports-base/coreutils+ripgrep.
# Under `sh` that `[[` silently fails and the myos sysroot (rust-std for the
# *-unknown-myos targets) is never built -> `E0463: can't find crate for core`.
# Override the default so steps behave identically to a stock runner. The
# ubuntu:24.04 image ships bash, so this is always available.
defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sysroot: ${{ steps.filter.outputs.sysroot }}
      c_userspace: ${{ steps.filter.outputs.c_userspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sysroot:
              - 'toolchain/std/**'
              - 'targets/**'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'scripts/myos-sysroot-lib.sh'
              - 'scripts/myos-rustc.sh'
              - 'scripts/myos-rustc-cross.sh'
              - 'scripts/check-wire-myos.sh'
              - 'scripts/build-sysroot.sh'
              - 'scripts/prepare-rust-std-myos.sh'
              - 'scripts/fetch-sysroot.sh'
              - 'scripts/package-sysroot.sh'
              - 'scripts/install-sysroot.sh'
              - 'scripts/build-std-hello.sh'
            c_userspace:
              - 'toolchain/newlib/**'
              - 'ports/**'
              - 'c/**'
              - 'scripts/myos-c-userspace-lib.sh'
              - 'scripts/build-c-hello.sh'
              - 'scripts/build-newlib.sh'
              - 'scripts/build-sbase.sh'
              - 'scripts/build-oksh.sh'
              - 'scripts/build-ubase.sh'
              - 'scripts/fetch-newlib.sh'
              - 'scripts/patch-newlib-myos.sh'
              - 'scripts/build-libgloss-myos.sh'
              - 'scripts/newlib-tool-wrappers.sh'
              - 'scripts/fetch-sbase.sh'
              - 'scripts/prepare-sbase-myos.sh'
              - 'scripts/fetch-ubase.sh'
              - 'scripts/fetch-oksh.sh'
              - 'scripts/prepare-oksh-myos.sh'
              - 'scripts/fetch-ripgrep.sh'
              - 'scripts/fetch-pcre2.sh'
              - 'scripts/prepare-ripgrep-myos.sh'
              - 'scripts/build-ripgrep-myos.sh'
              - 'scripts/build-pcre2-myos.sh'
              - 'scripts/build-uutils-myos.sh'
              - 'scripts/build-coreutils-myos.sh'
              - 'scripts/ci-registry.sh'

  wire-myos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src

      - name: Verify wire-myos.py on pinned nightly
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./toolchain/std/check-wire.sh

      - name: Probe latest nightly (informational)
        if: github.event_name == 'workflow_dispatch' && inputs.probe_latest_nightly
        continue-on-error: true
        run: |
          rustup toolchain install nightly --component rust-src
          MYOS_NIGHTLY=nightly ./toolchain/std/check-wire.sh

  sysroot:
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 45
    needs: [changes, wire-myos]
    if: |
      needs.changes.outputs.sysroot == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_sysroot)
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat

      - name: Cache myos sysroot
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-sysroot-v2
          workspaces: .
          cache-directories: target/myos-sysroot

      - name: Build and package sysroot
        id: sysroot_build
        env:
          MYOS_SYSROOT_SLIM: "1"
          MYOS_ZSTD_LEVEL: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_sysroot }}" == "true" ]]; then
            rm -f target/myos-sysroot/.myos-sysroot-version
          fi
          ./scripts/ci-registry.sh pull sysroot || true
          source ./toolchain/std/lib.sh
          if myos_sysroot_is_current; then
            echo "sysroot up to date"
          else
            ./toolchain/std/build-sysroot.sh
            ./scripts/ci-registry.sh push sysroot || true
          fi
          ./toolchain/std/package-sysroot.sh

      - name: Upload sysroot tarball
        if: steps.sysroot_build.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: myos-sysroot
          path: target/myos-sysroot-*.tar.zst
          if-no-files-found: warn
          retention-days: 7


  newlib:
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 45
    needs: [changes, wire-myos]
    if: |
      always() &&
      !cancelled() &&
      needs.wire-myos.result == 'success' &&
      needs.changes.outputs.c_userspace == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly (llvm-tools for strip wrappers)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-c-userspace
          workspaces: .

      - name: Build and push newlib sysroot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./scripts/ci-registry.sh pull newlib || true
          ./toolchain/newlib/build.sh
          ./scripts/ci-registry.sh push newlib || true

  ports-base:
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 45
    needs: [changes, wire-myos, sysroot, newlib]
    if: |
      always() &&
      !cancelled() &&
      needs.wire-myos.result == 'success' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: sbase
            script: ./ports/sbase/build.sh
            pull: sbase
          - port: ubase
            script: ./ports/ubase/build.sh
            pull: ubase
          - port: oksh
            script: ./ports/oksh/build.sh
            pull: oksh
          - port: coreutils
            script: ./ports/coreutils/build-uutils.sh
            pull: coreutils
            needs_sysroot: "1"
          - port: ripgrep
            script: ./ports/ripgrep/build.sh
            pull: ripgrep
            needs_sysroot: "1"
          - port: tcc
            script: ./ports/tcc/build.sh
            pull: tcc
          - port: ncurses
            script: ./ports/ncurses/build.sh
            pull: ncurses
          - port: zlib
            script: ./ports/zlib/build.sh
            pull: zlib
          - port: c-hello
            script: ./scripts/build-c-hello.sh
            pull: c-hello
          - port: curl
            script: ./ports/curl/build.sh
            pull: curl
          - port: std-hello
            script: ./toolchain/std/build-std-hello.sh
            pull: std-hello
            needs_sysroot: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: matrix.needs_sysroot == '1'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: myos-sysroot
          path: target

      - name: Build port (${{ matrix.port }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull ${{ matrix.pull }} || true
          if [[ "${{ matrix.needs_sysroot }}" == "1" ]] && compgen -G "target/myos-sysroot-*.tar.zst" > /dev/null; then
            export MYOS_SYSROOT_TARBALL="$(ls target/myos-sysroot-*.tar.zst | head -1)"
            ./toolchain/std/fetch-sysroot.sh
          elif [[ "${{ matrix.needs_sysroot }}" == "1" ]]; then
            ./toolchain/std/fetch-sysroot.sh
          fi
          ${{ matrix.script }}
          ./scripts/ci-registry.sh push ${{ matrix.pull }} || true

  ports-advanced:
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 45
    needs: [changes, wire-myos, sysroot, newlib, ports-base]
    if: |
      always() &&
      !cancelled() &&
      needs.wire-myos.result == 'success' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped') &&
      needs.ports-base.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: vim
            script: ./ports/vim/build.sh
            pull: vim
            dep_port: ncurses
          - port: git
            script: ./ports/git/build.sh
            pull: git
            dep_port: zlib
          - port: lynx
            script: ./ports/lynx/build.sh
            pull: lynx
            dep_port: ncurses
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: llvm-tools-preview

      - name: Build port (${{ matrix.port }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull ${{ matrix.dep_port }} || true
          ./scripts/ci-registry.sh pull ${{ matrix.pull }} || true
          ${{ matrix.script }}
          ./scripts/ci-registry.sh push ${{ matrix.pull }} || true

  build:
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 45
    needs: [changes, wire-myos, sysroot, newlib, ports-base, ports-advanced]
    if: |
      always() &&
      !cancelled() &&
      needs.wire-myos.result == 'success' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped') &&
      needs.ports-base.result == 'success' &&
      needs.ports-advanced.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: needs.sysroot.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: myos-sysroot
          path: target

      - name: Pull prebuilt ports and build kernels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./scripts/ci-registry.sh pull sysroot || true
          if compgen -G "target/myos-sysroot-*.tar.zst" > /dev/null; then
            export MYOS_SYSROOT_TARBALL="$(ls target/myos-sysroot-*.tar.zst | head -1)"
            ./toolchain/std/fetch-sysroot.sh
          else
            ./toolchain/std/fetch-sysroot.sh
          fi
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull std-hello || true
          ./scripts/ci-registry.sh pull c-hello || true
          ./scripts/ci-registry.sh pull curl || true
          ./scripts/ci-registry.sh pull sbase || true
          ./scripts/ci-registry.sh pull oksh || true
          ./scripts/ci-registry.sh pull ubase || true
          ./scripts/ci-registry.sh pull coreutils || true
          ./scripts/ci-registry.sh pull ripgrep || true
          ./scripts/ci-registry.sh pull tcc || true
          ./scripts/ci-registry.sh pull ncurses || true
          ./scripts/ci-registry.sh pull vim || true
          ./scripts/ci-registry.sh pull zlib || true
          ./scripts/ci-registry.sh pull git || true
          ./scripts/ci-registry.sh pull lynx || true
          ./scripts/ci-registry.sh push sysroot || true
          ./scripts/ci-registry.sh push newlib || true
          ./scripts/ci-registry.sh push std-hello || true
          ./scripts/ci-registry.sh push c-hello || true
          ./scripts/ci-registry.sh push curl || true
          ./scripts/ci-registry.sh push sbase || true
          ./scripts/ci-registry.sh push oksh || true
          ./scripts/ci-registry.sh push ubase || true
          ./scripts/ci-registry.sh push coreutils || true
          ./scripts/ci-registry.sh push ripgrep || true
          ./scripts/ci-registry.sh push tcc || true
          ./scripts/ci-registry.sh push ncurses || true
          ./scripts/ci-registry.sh push vim || true
          ./scripts/ci-registry.sh push zlib || true
          ./scripts/ci-registry.sh push git || true
          ./scripts/ci-registry.sh push lynx || true
          ./scripts/ci-build-kernels.sh

      - name: PS/2 scancode decode unit tests
        run: cargo test -p ps2-scancode

      - name: Pack CI build artifacts
        run: |
          shopt -s nullglob
          files=(
            target/debug/myos
            target/debug/build/myos-*/out
            target/bios.img
            target/uefi.img
            target/fat.img
            target/aarch64-unknown-none-softfloat/debug/kernel
            target/riscv64imac-unknown-none-elf/debug/kernel
            target/hello-*
            target/ok-*
            target/std-*
            target/c-hello-*
            target/sbase-*
            target/ubase-*
            target/oksh-*
            target/uutils-*
            target/coreutils-*
            target/rg-*
            target/tcc-*
            target/vim-*
            target/lynx-*
            target/ncurses-*
            target/zlib-*
            target/git-*
            target/libncurses-*
            target/pcre2-x86_64
            target/pcre2-aarch64
            target/pcre2-riscv64
            target/.myos-newlib-version
            target/newlib-x86_64
            target/newlib-aarch64
            target/newlib-riscv64
            target/.myos-c-hello-version
            target/.myos-sbase-version
            target/.myos-ubase-version
            target/.myos-oksh-version
            target/.myos-coreutils-version
            target/.myos-ripgrep-version
            target/.myos-tcc-version
            target/.myos-vim-version
            target/.myos-lynx-version
            target/.myos-ncurses-version
            target/.myos-zlib-version
            target/.myos-git-version
            target/.myos-std-hello-version
            target/.myos-ci-kernel-version
            target/limine-v*
          )
          if [ -f target/virt.dtb ]; then
            files+=(target/virt.dtb)
          fi
          if [ -d target/ovmf ]; then
            files+=(target/ovmf)
          fi
          required=(
            target/debug/myos
            target/bios.img
            target/uefi.img
            target/aarch64-unknown-none-softfloat/debug/kernel
            target/riscv64imac-unknown-none-elf/debug/kernel
            target/hello-x86_64-unknown-none
            target/hello-aarch64-unknown-none-softfloat
            target/hello-riscv64imac-unknown-none-elf
            target/ok-x86_64-unknown-none
            target/ok-aarch64-unknown-none-softfloat
            target/ok-riscv64imac-unknown-none-elf
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "::error::required CI artifact missing: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "target/ listing (hello/ok/kernels):"
            ls -la target/hello-* target/ok-* \
              target/aarch64-unknown-none-softfloat/debug/kernel \
              target/riscv64imac-unknown-none-elf/debug/kernel \
              target/bios.img target/uefi.img target/debug/myos 2>&1 || true
            exit 1
          fi
          tar -cf ci-build.tar "${files[@]}"
          ls -lh ci-build.tar

      - name: Upload CI build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: ci-build.tar
          if-no-files-found: error
          retention-days: 1
  boot:
    name: boot (${{ matrix.id }})
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 30
    needs: build
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.full_boot == true)) &&
      !(github.event_name == 'workflow_dispatch' && inputs.build_iso == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bios
            args: --ci
            required: true
          - id: uefi
            args: uefi --ci
            required: true
          - id: aarch64
            args: aarch64 --ci
            required: true
          - id: riscv64
            args: riscv64 --ci
            required: true
    steps:
      - uses: actions/checkout@v4

      - name: Download CI build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-build

      - name: Restore CI artifacts
        id: restore
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          if [[ -f ci-build.tar ]]; then
            echo "==> extracting ci-build.tar"
            tar -xf ci-build.tar
          fi
          if [[ -x target/debug/myos && -f target/bios.img \
                && -f target/aarch64-unknown-none-softfloat/debug/kernel \
                && -f target/riscv64imac-unknown-none-elf/debug/kernel ]]; then
            touch target/.myos-ci-prebuilt-kernels
            echo "CI artifacts ready (prebuilt kernels): $(ls -lh target/debug/myos target/bios.img)"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "CI artifacts incomplete; will rebuild"
            echo "mode=rebuild" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned nightly
        if: steps.restore.outputs.mode == 'rebuild'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        if: steps.restore.outputs.mode == 'rebuild'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: steps.restore.outputs.mode == 'rebuild'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: myos-sysroot
          path: target

      - name: Rebuild CI artifacts
        if: steps.restore.outputs.mode == 'rebuild'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          ./scripts/ci-registry.sh pull sysroot || true
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull std-hello || true
          ./scripts/ci-registry.sh pull c-hello || true
          ./scripts/ci-registry.sh pull curl || true
          ./scripts/ci-registry.sh pull sbase || true
          ./scripts/ci-registry.sh pull oksh || true
          ./scripts/ci-registry.sh pull ubase || true
          ./scripts/ci-registry.sh pull coreutils || true
          ./scripts/ci-registry.sh pull ripgrep || true
          ./scripts/ci-registry.sh pull tcc || true
          ./scripts/ci-registry.sh pull ncurses || true
          ./scripts/ci-registry.sh pull vim || true
          ./scripts/ci-registry.sh pull zlib || true
          ./scripts/ci-registry.sh pull git || true
          ./scripts/ci-registry.sh pull lynx || true
          ./scripts/ci-restore-or-build.sh
          ./scripts/ci-registry.sh push sysroot || true
          ./scripts/ci-registry.sh push newlib || true
          ./scripts/ci-registry.sh push std-hello || true
          ./scripts/ci-registry.sh push c-hello || true
          ./scripts/ci-registry.sh push curl || true
          ./scripts/ci-registry.sh push sbase || true
          ./scripts/ci-registry.sh push oksh || true
          ./scripts/ci-registry.sh push ubase || true
          ./scripts/ci-registry.sh push coreutils || true
          ./scripts/ci-registry.sh push ripgrep || true
          ./scripts/ci-registry.sh push tcc || true
          ./scripts/ci-registry.sh push ncurses || true
          ./scripts/ci-registry.sh push vim || true
          ./scripts/ci-registry.sh push zlib || true
          ./scripts/ci-registry.sh push git || true
          ./scripts/ci-registry.sh push lynx || true

      - name: Boot in QEMU
        continue-on-error: ${{ !matrix.required }}
        env:
          MYOS_SKIP_KERNEL_REBUILD: "1"
        run: ./target/debug/myos ${{ matrix.args }}
  boot-mini:
    name: boot-mini (${{ matrix.id }})
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 30
    needs: build
    # Reduced-testing boots: everything except the HTTPS/curl smokes
    # (MYOS_CI_MINI=1). Runs on every build; the full boot jobs above only run
    # on the daily scheduled run or a manual dispatch with full_boot.
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.build_iso == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bios
            args: --ci
            required: true
          - id: uefi
            args: uefi --ci
            required: true
          - id: aarch64
            args: aarch64 --ci
            required: true
          - id: riscv64
            args: riscv64 --ci
            required: true
    steps:
      - uses: actions/checkout@v4

      - name: Download CI build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-build

      - name: Restore CI artifacts
        id: restore
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          if [[ -f ci-build.tar ]]; then
            echo "==> extracting ci-build.tar"
            tar -xf ci-build.tar
          fi
          if [[ -x target/debug/myos && -f target/bios.img \
                && -f target/aarch64-unknown-none-softfloat/debug/kernel \
                && -f target/riscv64imac-unknown-none-elf/debug/kernel ]]; then
            touch target/.myos-ci-prebuilt-kernels
            echo "CI artifacts ready (prebuilt kernels): $(ls -lh target/debug/myos target/bios.img)"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "CI artifacts incomplete; will rebuild"
            echo "mode=rebuild" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned nightly
        if: steps.restore.outputs.mode == 'rebuild'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        if: steps.restore.outputs.mode == 'rebuild'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: steps.restore.outputs.mode == 'rebuild'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: myos-sysroot
          path: target

      - name: Rebuild CI artifacts
        if: steps.restore.outputs.mode == 'rebuild'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          ./scripts/ci-registry.sh pull sysroot || true
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull std-hello || true
          ./scripts/ci-registry.sh pull c-hello || true
          ./scripts/ci-registry.sh pull curl || true
          ./scripts/ci-registry.sh pull sbase || true
          ./scripts/ci-registry.sh pull oksh || true
          ./scripts/ci-registry.sh pull ubase || true
          ./scripts/ci-registry.sh pull coreutils || true
          ./scripts/ci-registry.sh pull ripgrep || true
          ./scripts/ci-registry.sh pull tcc || true
          ./scripts/ci-registry.sh pull ncurses || true
          ./scripts/ci-registry.sh pull vim || true
          ./scripts/ci-registry.sh pull zlib || true
          ./scripts/ci-registry.sh pull git || true
          ./scripts/ci-registry.sh pull lynx || true
          ./scripts/ci-restore-or-build.sh
          ./scripts/ci-registry.sh push sysroot || true
          ./scripts/ci-registry.sh push newlib || true
          ./scripts/ci-registry.sh push std-hello || true
          ./scripts/ci-registry.sh push c-hello || true
          ./scripts/ci-registry.sh push curl || true
          ./scripts/ci-registry.sh push sbase || true
          ./scripts/ci-registry.sh push oksh || true
          ./scripts/ci-registry.sh push ubase || true
          ./scripts/ci-registry.sh push coreutils || true
          ./scripts/ci-registry.sh push ripgrep || true
          ./scripts/ci-registry.sh push tcc || true
          ./scripts/ci-registry.sh push ncurses || true
          ./scripts/ci-registry.sh push vim || true
          ./scripts/ci-registry.sh push zlib || true
          ./scripts/ci-registry.sh push git || true
          ./scripts/ci-registry.sh push lynx || true

      - name: Boot in QEMU
        continue-on-error: ${{ !matrix.required }}
        env:
          MYOS_SKIP_KERNEL_REBUILD: "1"
          MYOS_CI_MINI: "1"
        run: ./target/debug/myos ${{ matrix.args }}

  iso:
    # Optional, manual-only distributable CD image. Folds the former standalone
    # iso.yml workflow into the CI pipeline: it REUSES the build job's packed
    # outputs (sysroot/newlib/ports/hello/ok/limine) instead of re-running the
    # whole toolchain/port build. Only `cargo build` runs here, which rebuilds
    # the small host `myos` binary + x86_64 kernel artifact from source.
    name: iso (x86_64 hybrid)
    runs-on: ubuntu-latest
    container: ghcr.io/davide-matasci/myos-ci:latest
    timeout-minutes: 30
    needs: build
    if: >-
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.build_iso == true
    steps:
      - uses: actions/checkout@v4

      - name: Download CI build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-build

      - name: Restore CI artifacts
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          if [[ -f ci-build.tar ]]; then
            echo "==> extracting ci-build.tar"
            tar -xf ci-build.tar
          fi
          test -x target/debug/myos && echo "host myos present; reusing build outputs"

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Build x86_64 hybrid ISO
        run: |
          # Regenerate the newlib clang wrappers (x86_64-unknown-myos-cc & co):
          # ci-build.tar ships target/newlib-* (headers/libs) but not
          # target/newlib-bin, and rebuilding the kernel from source re-runs
          # user/tls build.rs -> ports/mbedtls/build.sh, which needs the
          # wrapper on PATH.
          ./toolchain/newlib/tool-wrappers.sh
          export PATH="$PWD/target/newlib-bin:$PATH"
          cargo clean -p myos
          cargo build
          cargo run -- iso
          test -f target/myos-x86_64.iso

      - name: Upload ISO
        if: hashFiles('target/myos-x86_64.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: myos-x86_64-iso
          path: target/myos-x86_64.iso
          if-no-files-found: error
          retention-days: 3
