name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned: floating nightly fails to link bootloader-x86_64-uefi.
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm

      - name: Build kernel and BIOS+UEFI disk images
        run: cargo build

      - name: Boot BIOS in QEMU
        timeout-minutes: 5
        run: cargo run -- --ci

      - name: Boot UEFI in QEMU
        timeout-minutes: 5
        run: cargo run -- uefi --ci

      - name: Boot AArch64 in QEMU
        timeout-minutes: 5
        run: cargo run -- aarch64 --ci
