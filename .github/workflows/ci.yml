name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned: floating nightly fails to link bootloader leftovers / keep the
      # known-good toolchain until an explicit unpin.
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat

      # prefix-key busts the poisoned rust-cache from 77c4886: restored target/
      # mtimes made cargo skip build.rs, so CI booted a stale bios.img with
      # broken FAT 8.3 names and zero serial.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-1

      - name: Install QEMU, AArch64 UEFI firmware, and a C compiler
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-efi-aarch64 gcc

      - name: Build patched std hello (x86-myos)
        run: |
          chmod +x scripts/build-std-hello.sh scripts/prepare-rust-std-myos.sh scripts/myos-rustc.sh
          ./scripts/build-std-hello.sh

      - name: Build kernel and Limine BIOS+UEFI disk images
        run: |
          cargo clean -p myos
          cargo build
          test -f target/bios.img
          od -An -tx1 -N 16 target/bios.img

      - name: Boot BIOS in QEMU
        id: bios
        timeout-minutes: 5
        continue-on-error: true
        run: cargo run -- --ci

      - name: Boot UEFI in QEMU
        id: uefi
        timeout-minutes: 5
        continue-on-error: true
        run: cargo run -- uefi --ci

      - name: Boot AArch64 in QEMU
        id: aarch64
        timeout-minutes: 5
        continue-on-error: true
        run: cargo run -- aarch64 --ci

      - name: Fail if any boot failed
        if: steps.bios.outcome == 'failure' || steps.uefi.outcome == 'failure' || steps.aarch64.outcome == 'failure'
        run: exit 1
