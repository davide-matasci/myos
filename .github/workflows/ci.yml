name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must follow rust-toolchain.toml (pinned). @nightly would float and
      # break bootloader-x86_64-uefi on current nightly.
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build kernel and BIOS+UEFI disk images
        run: cargo build

      - name: Boot BIOS in QEMU
        timeout-minutes: 5
        run: cargo run -- --ci

      - name: Boot UEFI in QEMU
        timeout-minutes: 5
        run: cargo run -- uefi --ci
