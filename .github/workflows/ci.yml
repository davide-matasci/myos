name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Daily full boot; otherwise boot-mini.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      full_boot:
        description: Run full boot jobs
        type: boolean
        default: false

# A newer run of the same kind on the same ref replaces the older one. The
# kind is part of the group so the daily scheduled run never cancels a push
# to master: that run publishes the packages and the ISO.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  wire-myos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src

      - name: Verify wire-myos.py on pinned nightly
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./toolchain/std/check-wire.sh

  ports:
    needs: wire-myos
    uses: ./.github/workflows/ci-ports.yml
    secrets: inherit

  runtime:
    needs: [ports, wire-myos]
    if: always() && !cancelled() && needs.wire-myos.result == 'success' && needs.ports.result == 'success'
    # contents: write for the publish job (the rolling release on pushes to
    # master); a called workflow cannot have more than its caller.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ci-runtime.yml
    with:
      full_boot: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_boot) }}
    secrets: inherit
