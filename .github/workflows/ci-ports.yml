name: CI ports
# Reusable: sysroot / newlib / ports-*. Building belongs here — not in boot.
# The ports matrices come from the port descriptors (scripts/ports.sh
# --matrix: every ports/, packages/, user/ and toolchain/std directory with a
# port.env and a build script), so adding a port does not touch this file.
on:
  workflow_call:
    inputs:
      sysroot:
        type: string
        required: true
      c_userspace:
        type: string
        required: true
      force_sysroot:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      advanced: ${{ steps.matrix.outputs.advanced }}
    steps:
      - uses: actions/checkout@v6
      - name: Ports matrices from the descriptors
        id: matrix
        run: |
          chmod +x scripts/*.sh
          echo "base=$(./scripts/ports.sh --matrix base)" >> "$GITHUB_OUTPUT"
          echo "advanced=$(./scripts/ports.sh --matrix advanced)" >> "$GITHUB_OUTPUT"
          ./scripts/ports.sh --matrix base
          ./scripts/ports.sh --matrix advanced

  sysroot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    if: |
      inputs.sysroot == 'true' || inputs.force_sysroot
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat

      - name: Cache myos sysroot
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-sysroot-v2
          workspaces: .
          cache-directories: target/myos-sysroot

      - name: Build and package sysroot
        id: sysroot_build
        env:
          MYOS_SYSROOT_SLIM: "1"
          MYOS_ZSTD_LEVEL: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          MYOS_FORCE_SYSROOT: ${{ inputs.force_sysroot && '1' || '' }}
        run: ./scripts/ci-sysroot-job.sh

      - name: Upload sysroot tarball
        if: steps.sysroot_build.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: myos-sysroot
          path: target/myos-sysroot-*.tar.zst
          if-no-files-found: warn
          retention-days: 7

  newlib:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    if: |
      inputs.c_userspace == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly (llvm-tools for strip wrappers)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-c-userspace
          workspaces: .

      - name: Build and push newlib sysroot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-newlib-job.sh

  ports-base:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: [plan, sysroot, newlib]
    if: |
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.base) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: matrix.needs_sysroot == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: myos-sysroot
          path: target

      - name: Build port (${{ matrix.port }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-build-port.sh "${{ matrix.port }}" "${{ matrix.script }}" "${{ matrix.needs_sysroot }}"

  ports-advanced:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: [plan, sysroot, newlib, ports-base]
    if: |
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped') &&
      needs.ports-base.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.advanced) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: llvm-tools-preview

      - name: Download prebuilt sysroot
        if: matrix.needs_sysroot == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: myos-sysroot
          path: target

      - name: Build port (${{ matrix.port }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-build-port.sh "${{ matrix.port }}" "${{ matrix.script }}" "${{ matrix.needs_sysroot }}" "${{ matrix.deps }}"
