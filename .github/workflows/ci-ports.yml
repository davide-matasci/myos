name: CI ports
# Reusable: the toolchains (sysroot, newlib) and every port. Building belongs
# here, not in the boot jobs. The ports matrix comes from the port
# descriptors (scripts/ports.sh --matrix: every ports/, packages/, user/ and
# toolchain/std directory with a port.env and a build script), so adding a
# port does not touch this file. Everything is cached on GHCR under a hash
# of its inputs (scripts/ci-registry.sh): the plan job asks the registry
# which pieces it lacks (scripts/ci-ports-plan.sh), and only those get a
# job. When the registry has everything, no port job starts at all.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # wire-myos.py patches the std sources the sysroot is built from: check it
  # against the pinned nightly before anything is built (beside the plan).
  wire-myos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src

      - name: Verify wire-myos.py on pinned nightly
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./toolchain/std/check-wire.sh

  plan:
    runs-on: ubuntu-latest
    # The same container (and so the same workspace path) as the jobs that
    # build: a port's input hash includes the paths sha256sum prints.
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 5
    outputs:
      ports: ${{ steps.plan.outputs.ports }}
      sysroot: ${{ steps.plan.outputs.sysroot }}
      newlib: ${{ steps.plan.outputs.newlib }}
    steps:
      - uses: actions/checkout@v6
      - name: What the registry lacks
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-ports-plan.sh

  sysroot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: [plan, wire-myos]
    if: needs.plan.outputs.sysroot == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat

      - name: Cache myos sysroot
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-sysroot-v2
          workspaces: .
          cache-directories: target/myos-sysroot

      - name: Build and package sysroot
        id: sysroot_build
        env:
          MYOS_SYSROOT_SLIM: "1"
          MYOS_ZSTD_LEVEL: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-sysroot-job.sh

      - name: Upload sysroot tarball
        if: steps.sysroot_build.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: myos-sysroot
          path: target/myos-sysroot-*.tar.zst
          if-no-files-found: warn
          retention-days: 7

  newlib:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: [plan, wire-myos]
    if: needs.plan.outputs.newlib == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly (llvm-tools for strip wrappers)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: myos-c-userspace
          workspaces: .

      - name: Build and push newlib sysroot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-newlib-job.sh

  ports:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: [plan, wire-myos, sysroot, newlib]
    if: |
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.wire-myos.result == 'success' &&
      needs.plan.outputs.ports != '[]' &&
      (needs.sysroot.result == 'success' || needs.sysroot.result == 'skipped') &&
      (needs.newlib.result == 'success' || needs.newlib.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.ports) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      - name: Download prebuilt sysroot
        if: matrix.needs_sysroot == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: myos-sysroot
          path: target

      - name: Build port (${{ matrix.port }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./scripts/ci-build-port.sh "${{ matrix.port }}" "${{ matrix.script }}" "${{ matrix.needs_sysroot }}" "${{ matrix.deps }}"
