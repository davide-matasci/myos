name: ISO

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: write

jobs:
  x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils
      - name: Install xorriso and build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso clang lld binutils-aarch64-linux-gnu autoconf automake libtool texinfo zstd bison rsync

      - name: Build myos sysroot and userspace ELFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYOS_CI_REGISTRY_PUSH: "true"
        run: |
          chmod +x scripts/*.sh ports/*/*.sh toolchain/*/*.sh
          ./toolchain/std/fetch-sysroot.sh
          ./scripts/ci-registry.sh pull newlib || true
          ./scripts/ci-registry.sh pull std-hello || true
          ./scripts/ci-registry.sh pull c-hello || true
          ./scripts/ci-registry.sh pull sbase || true
          ./scripts/ci-registry.sh pull oksh || true
          ./scripts/ci-registry.sh pull ubase || true
          ./scripts/ci-registry.sh pull coreutils || true
          ./scripts/ci-registry.sh pull ripgrep || true
          ./scripts/ci-registry.sh pull tcc || true
          ./toolchain/std/build-std-hello.sh
          ./scripts/build-c-hello.sh
          ./ports/sbase/build.sh
          ./ports/oksh/build.sh
          ./ports/coreutils/build-uutils.sh
          ./ports/ubase/build.sh
          ./ports/ripgrep/build.sh
          ./ports/tcc/build.sh
          ./scripts/ci-registry.sh push newlib || true
          ./scripts/ci-registry.sh push std-hello || true
          ./scripts/ci-registry.sh push c-hello || true
          ./scripts/ci-registry.sh push sbase || true
          ./scripts/ci-registry.sh push oksh || true
          ./scripts/ci-registry.sh push ubase || true
          ./scripts/ci-registry.sh push coreutils || true
          ./scripts/ci-registry.sh push ripgrep || true
          ./scripts/ci-registry.sh push tcc || true

      - name: Build x86_64 hybrid ISO
        run: |
          cargo clean -p myos
          cargo build
          cargo run -- iso
          test -f target/myos-x86_64.iso
      - name: Upload ISO
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: myos-x86_64-iso
          path: target/myos-x86_64.iso
          if-no-files-found: error
          retention-days: 3
