name: ISO

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-2
          cache-directories: |
            target/myos-sysroot
            target/newlib-x86_64
            target/newlib-aarch64
            target/newlib-src
            target/newlib-bin
            target/sbase-src
            target/sbase-myos-build
            target/oksh-src
            target/oksh-myos-build
      - name: Install xorriso and build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso clang lld binutils-aarch64-linux-gnu autoconf automake libtool texinfo zstd bison rsync

      - name: Build myos sysroot, newlib, C/sbase/oksh/uutils ELFs
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-sysroot.sh
          ./scripts/build-std-hello.sh
          ./scripts/build-c-hello.sh
          ./scripts/build-sbase.sh
          ./scripts/build-oksh.sh
          ./scripts/build-uutils-myos.sh

      - name: Build x86_64 hybrid ISO
        run: |
          cargo clean -p myos
          cargo build
          cargo run -- iso
          test -f target/myos-x86_64.iso
      - name: Upload ISO
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: myos-x86_64-iso
          path: target/myos-x86_64.iso
          if-no-files-found: error
          retention-days: 3
