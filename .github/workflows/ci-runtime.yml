name: CI runtime
# plan decides the boots from the change (scripts/ci-select.py); build packs
# a complete ci-build.tar.zst; the boots ONLY extract + assert + QEMU.
on:
  workflow_call:
    inputs:
      full_boot:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  # The publish job checks that a pull request still wants its release.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Which boot tests the change needs (docs/testing.md, "In CI"): every
  # test carries tags, and the changed paths select them. A push to
  # master, the daily run, a dispatch with full_boot and the `ci:full`
  # label run everything; documentation alone boots nothing. The long
  # tests get boots of their own, so a full run is a dozen boots of ten
  # minutes in parallel, not one of thirty.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boots: ${{ steps.plan.outputs.boots }}
      features: ${{ steps.plan.outputs.features }}
      release: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff against the pull request's base.
          fetch-depth: 0
      - name: Select the boot tests
        id: plan
        run: |
          args=(--event "${{ github.event_name }}")
          if [[ "${{ inputs.full_boot }}" == true ]]; then args+=(--all); fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}" == true ]]; then args+=(--full-label); fi
          if [[ -n "${{ github.event.pull_request.base.sha }}" ]]; then
            args+=(--base "${{ github.event.pull_request.base.sha }}" --head HEAD)
          elif [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.full_boot }}" != true ]]; then
            # A dispatch on a branch without full_boot: what the branch changes.
            args+=(--base origin/master --head HEAD)
          fi
          python3 scripts/ci-select.py "${args[@]}"
      # The release this run publishes once its boots pass (docs/packages.md,
      # "Publishing"): `rolling` from master; `pr-N` from a pull request
      # labelled `ci:prerelease`, a mirror to try it on hardware before the
      # merge (not from a fork: its token cannot write releases); none
      # otherwise.
      - name: Select the release
        id: release
        env:
          PRERELEASE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:prerelease') && github.event.pull_request.head.repo.full_name == github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tag=
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == schedule ]] && [[ "$GITHUB_REF" == refs/heads/master ]]; then
            tag=rolling
          elif [[ "$PRERELEASE" == true ]]; then
            tag="pr-$PR"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: ${tag:-none}"

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 45
    needs: plan
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi, aarch64-unknown-none-softfloat, riscv64imac-unknown-none-elf, aarch64-unknown-none, riscv64gc-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: limine-8.3-6
          cache-directories: |
            target/myos-sysroot
            target/patched-crates
            target/crate-fetch-coreutils

      # The sysroot job's tarball when it ran in this run; otherwise the
      # registry has it (ci-build-pull-and-kernels.sh pulls it).
      - name: Download prebuilt sysroot
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: myos-sysroot
          path: target

      - name: Pull prebuilt ports and build kernels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The image carries the optional Linux layer when a boot runs its
          # tests (the plan says); the default build is what boots otherwise.
          MYOS_CI_FEATURES: ${{ needs.plan.outputs.features }}
          MYOS_CI_REGISTRY_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-build-pull-and-kernels.sh

      - name: Host unit tests (the module ABI's status lines; PS/2 decode; ext2 against e2fsprogs; FAT against dosfstools; the Intel and MediaTek Wi-Fi drivers against their models; netd's patched smoltcp)
        run: |
          # dosfstools and mtools are in the Dockerfile; an image built
          # before them (it is rebuilt from master) installs them here.
          command -v fsck.fat > /dev/null && command -v mtype > /dev/null \
            || { apt-get update -q && apt-get install -y -q --no-install-recommends dosfstools mtools; }
          cargo test -p myos-abi -p ps2-scancode -p ext2fs -p fatvol -p sdio -p iwx -p mtw -p bwfm -p wpa
          # The patched smoltcp is laid out when netd is built; a current
          # kernels bundle skips that build, so lay it out here (a no-op
          # when it is there).
          ./user/net/smoltcp/prepare.sh
          cargo test --manifest-path target/smoltcp-myos/Cargo.toml --lib

      # The Raspberry Pi 3's boot files (boot/rpi3/build.sh, the rpi3 boot):
      # U-Boot, built with the GNU aarch64 cross compiler, cached by what
      # makes it; the stub and the board's tree are quick.
      - name: Raspberry Pi 3 U-Boot cache
        uses: actions/cache@v4
        with:
          path: |
            target/rpi3/u-boot.bin
            target/rpi3/u-boot.version
          key: rpi3-uboot-${{ hashFiles('boot/rpi3/versions.env', 'boot/rpi3/build.sh') }}

      - name: Raspberry Pi 3 boot files
        run: |
          # The cross compiler and U-Boot's host tools' headers are in the
          # Dockerfile; an image built before them (it is rebuilt from
          # master) installs them here, when U-Boot is not cached.
          if [[ ! -f target/rpi3/u-boot.bin ]] && ! command -v aarch64-linux-gnu-gcc > /dev/null; then
            apt-get update -q && apt-get install -y -q --no-install-recommends \
              gcc-aarch64-linux-gnu libssl-dev libgnutls28-dev
          fi
          ./boot/rpi3/build.sh

      - name: Pack CI build artifacts
        env:
          MYOS_CI_FEATURES: ${{ needs.plan.outputs.features }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-pack-build-artifacts.sh

      # Already zstd-compressed (multithreaded): zipping it again at the
      # default level took longer than the upload itself.
      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-build
          path: ci-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The packages of the three arches (docs/packages.md): what the
      # publish job puts on the rolling release after the boots pass, with
      # each arch's boot files (get-myos --upgrade, docs/install.md) from
      # the kernels this job already has.
      - name: Build packages
        env:
          MYOS_SKIP_KERNEL_REBUILD: "1"
        run: ./target/debug/myos packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: myos-packages
          path: target/packages
          if-no-files-found: error
          retention-days: 7

      # The registry pushes the build step left running in the background.
      - name: Finish registry pushes
        if: always()
        run: ./scripts/ci-registry-push-wait.sh

  boot:
    name: boot (${{ matrix.id }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      # /dev/kvm: the x86 boots run on the runner's CPU (the plan's `accel`;
      # GitHub's Linux runners have the device, a runner without it would
      # not start this container).
      options: -e HOME=/root --device /dev/kvm
    timeout-minutes: 45
    needs: [plan, build]
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.plan.outputs.boots != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.boots) }}
    steps:
      - uses: actions/checkout@v6

      - name: Download CI build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ci-build

      - name: Extract and assert CI artifacts
        run: |
          chmod +x scripts/*.sh
          if [[ ! -f ci-build.tar.zst ]]; then
            echo "::error::ci-build.tar.zst missing after download; build job must upload it"
            exit 1
          fi
          echo "==> extracting ci-build.tar.zst"
          tar --zstd -xf ci-build.tar.zst
          # Fail hard if incomplete; never rebuild here.
          ./scripts/ci-assert-boot-artifacts.sh

      # The Alpine disk the `alpine-disk` tests mount (rustc, Python, an X
      # client: linux-compat/alpine-disks.sh), made once per key (the
      # scripts that make it) and cached; a miss makes it here, and the
      # cache takes it after the boot.
      - name: Alpine disk cache key
        if: matrix.alpine == 'true'
        id: alpine
        run: echo "key=alpine-disk-${{ matrix.arch }}-$(./linux-compat/alpine-disks.sh --hash)" >> "$GITHUB_OUTPUT"
      - name: Alpine disk
        if: matrix.alpine == 'true'
        uses: actions/cache@v4
        with:
          path: |
            target/alpine-${{ matrix.arch }}.img
            target/.myos-alpine-disks-${{ matrix.arch }}-version
          key: ${{ steps.alpine.outputs.key }}

      # The rpi3 boot fills the board's device tree in with fdtput; an image
      # built before device-tree-compiler was in the Dockerfile installs it.
      - name: Raspberry Pi 3 tools
        if: matrix.machine == 'rpi3'
        run: |
          command -v fdtput > /dev/null \
            || { apt-get update -q && apt-get install -y -q --no-install-recommends device-tree-compiler; }

      - name: Boot and test in QEMU
        id: boot
        continue-on-error: ${{ !matrix.required }}
        env:
          MYOS_SKIP_KERNEL_REBUILD: "1"
          # The boot's network traffic (QEMU's filter-dump), kept below
          # when the boot fails: a packet lost or late in an exchange with
          # the host shows there (issue #656's mute connection).
          MYOS_NET_PCAP: target/net0-${{ matrix.id }}.pcap
          # The aarch64 boots' GIC version (2 when unset): the launcher
          # dumps the matching device tree into the ESP before each boot.
          MYOS_AARCH64_GIC: ${{ matrix.gic }}
          # The x86 boots' IOMMU (Intel's when unset, `amd` on the
          # bios-amd machine), and their accelerator (`kvm`: the runner's
          # CPU through /dev/kvm; TCG when unset, as the other arches).
          MYOS_X86_IOMMU: ${{ matrix.iommu }}
          MYOS_X86_ACCEL: ${{ matrix.accel }}
          # The riscv64 boots' interrupt controllers (the AIA when unset,
          # `plic` on the riscv64-plic machine).
          MYOS_RISCV_INTC: ${{ matrix.intc }}
        run: ./target/debug/myos ${{ matrix.args }}

      # `always()`: without a status function the condition gets `success()`
      # too, and a required boot's failure had failed the job already, so
      # the capture of exactly the boots it was for never went up.
      - name: Upload the packet capture of a failed boot
        if: always() && steps.boot.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: net0-pcap-${{ matrix.id }}
          path: target/net0-${{ matrix.id }}.pcap*
          if-no-files-found: ignore
          retention-days: 7

  iso:
    # x86_64 hybrid ISO from the build outputs, for a run that publishes (the
    # plan's release): the image with everything in it (the Linux layer
    # loaded at boot and its tests), published by the publish job. The
    # bios and uefi boots test the same kernel and initramfs from the disk
    # images; the ISO itself is not booted. Toolchain only for
    # `cargo run -- iso`; must not rebuild ports here.
    name: iso (x86_64 hybrid)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/davide-matasci/myos-ci:latest
      options: -e HOME=/root
    timeout-minutes: 30
    needs: [plan, build]
    if: >-
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.plan.outputs.release != ''
    steps:
      - uses: actions/checkout@v6

      - name: Download CI build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ci-build

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-26
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Build x86_64 hybrid ISO from ci-build artifacts
        run: ./scripts/ci-iso-from-artifacts.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: myos-x86_64-iso
          path: target/myos-x86_64.iso
          if-no-files-found: error
          retention-days: 7

  # Master (a push, or the daily scheduled full boot): the packages and the
  # ISO go to the rolling GitHub release `rolling` (the default mirror of
  # get-myos), once every boot of this run passed. A pull request labelled
  # `ci:prerelease` gets the same as `pr-N`, deleted when it closes or loses
  # the label (cleanup-pr-artifacts.yml). The tag moves to the published
  # commit: the binaries of the copyleft ports (git, lynx, make, ...) are
  # redistributed with their corresponding source that way
  # (THIRD_PARTY_NOTICES.md).
  publish:
    name: publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, build, boot, iso]
    if: >-
      always() &&
      !cancelled() &&
      needs.plan.outputs.release != '' &&
      needs.build.result == 'success' &&
      needs.boot.result == 'success' &&
      needs.iso.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: myos-packages
          path: target/packages

      - name: Download ISO
        uses: actions/download-artifact@v7
        with:
          name: myos-x86_64-iso
          path: target

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="$TAG"
          title="myos (rolling)"
          notes="Built from ${GITHUB_SHA} (the tag points at it). myos-x86_64.iso boots on BIOS and UEFI machines (and from a USB stick). The <arch>-*.tar.gz files are the packages: install one on a running myos with \`get-myos NAME\`, see docs/packages.md. Third-party licenses: THIRD_PARTY_NOTICES.md at that commit; the copyleft ports' sources are the pinned upstreams plus the patches in the repository."
          if [[ -n "$PR" ]]; then
            # The label or the pull request may have gone while the boots
            # ran: the cleanup has deleted the release, so do not bring it
            # back.
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,labels \
              --jq '.state + " " + ([.labels[].name] | join(","))')
            if [[ "$state" != "OPEN "* || ",${state#* }," != *",ci:prerelease,"* ]]; then
              echo "pull request #$PR is no longer open with ci:prerelease ($state): not publishing"
              exit 0
            fi
            title="myos (pull request #$PR)"
            notes="Pull request #$PR, built from ${GITHUB_SHA} (its merge into the base branch; the tag points at it), after the boot tests the pull request selects. Deleted when the pull request closes. Try it on a running myos: \`get-myos -m https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag --upgrade\` (docs/packages.md, \"Publishing\"). ${notes#*(the tag points at it). }"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit "$tag" --notes "$notes" --prerelease
          else
            gh release create "$tag" --target "${GITHUB_SHA}" --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          # GitHub's API answers the replacement of an asset with a 5xx now
          # and then (PR #743's first republish once; CI 2513 three uploads
          # of the whole set in a row, each on another asset). The set is
          # some 230 assets, each replaced in a request of its own, so a
          # retry of the whole set fails about as often as the first try.
          # Each round uploads only what is not up yet, an asset of this
          # run's (made since the job began, a minute of clock skew allowed)
          # in state uploaded: a failed asset is tried again without the
          # rest being replaced again.
          since=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          files=(target/packages/* target/myos-x86_64.iso)
          for try in 1 2 3 4 5 6; do
            up=$(gh release view "$tag" --json assets \
              --jq ".assets[] | select(.state == \"uploaded\" and .createdAt >= \"$since\") | .name")
            pending=()
            for f in "${files[@]}"; do
              grep -qxF "${f##*/}" <<< "$up" || pending+=("$f")
            done
            [[ ${#pending[@]} -gt 0 ]] || break
            gh release upload "$tag" "${pending[@]}" --clobber && continue
            if [[ $try -eq 6 ]]; then
              echo "::error::${#pending[@]} asset(s) not uploaded after $try tries"
              exit 1
            fi
            echo "upload failed (try $try, ${#pending[@]} to go): again in 20 s"
            sleep 20
          done
          ls -l target/packages | tail -n +2 | wc -l
