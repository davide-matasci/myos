# nginx on myos (packages/nginx): what `run-myos nginx` serves. It writes
# its pid, logs and temporary files under /tmp/nginx.

worker_processes  1;

events {
    # A process has 256 fds on myos: a client is one, a proxied one two.
    worker_connections  128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    keepalive_timeout  65;
    gzip  on;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   html;
            index  index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
