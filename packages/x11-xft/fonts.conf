<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- myos: fontconfig's configuration (/lib/x11/etc/fonts/fonts.conf). The
     fonts are the x11-fonts package's, the cache is rebuilt in /tmp. -->
<fontconfig>
  <dir>/lib/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <!-- The monospace fonts programs ask for by name (st's Liberation Mono,
       and their kin): the monospace one here. A family fontconfig has no
       font of gets the closest it has, DejaVu Sans (right for a sans-serif
       one, Arial, Helvetica, GTK's Sans), and a terminal would draw that
       proportional font in its cells. -->
  <alias binding="same"><family>Liberation Mono</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Cousine</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Courier New</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Courier</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Nimbus Mono PS</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Bitstream Vera Sans Mono</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Consolas</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Menlo</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Monaco</family><default><family>monospace</family></default></alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
