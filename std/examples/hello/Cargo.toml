[package]
name = "std-hello-myos"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "std-hello"
path = "main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[unstable]
build-std = ["std", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]
