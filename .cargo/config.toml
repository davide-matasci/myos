[unstable]
bindeps = true
json-target-spec = true

# Custom userspace triples for the myos patched std sysroot (see std/pal/README.md).
[env]
RUSTC_BOOTSTRAP = "1"
MYOS_SYSROOT = { value = "target/myos-sysroot", relative = true }

[target.x86_64-unknown-myos]
rustflags = ["-C", "panic=abort"]
linker = "rust-lld"

[target.aarch64-unknown-myos]
rustflags = ["-C", "panic=abort"]
linker = "rust-lld"

# Hello is a no_std artifact; force abort even if cargo picks the
# build-override profile (panic=unwind by default).
# Limine panics on ET_DYN without PT_DYNAMIC (CI #44). Static + kernel
# code model yields a higher-half ET_EXEC.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "panic=abort",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
]

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "panic=abort", "-C", "relocation-model=static"]
