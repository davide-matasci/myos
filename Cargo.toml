[workspace]
resolver = "3"
members = ["kernel", "modules/hello", "modules/abi"]
default-members = ["."]

[package]
name = "myos"
version = "0.1.0"
edition = "2024"
description = "A small kernel that boots in QEMU on x86_64 (BIOS/UEFI) and AArch64 (virt)."
publish = false

[dependencies]
ovmf-prebuilt = "0.2.9"

[build-dependencies]
bootloader = "0.11.17"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"

[profile.dev.package.hello]
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"

[profile.release.package.hello]
opt-level = "s"
debug = false
strip = "debuginfo"
