[workspace]
resolver = "3"
members = ["kernel", "modules/abi", "modules/console/ps2-scancode", "modules/ext2/ext2fs", "modules/fat/fatvol"]
default-members = ["."]
# Crates fetched and patched into target/ (user/net/smoltcp) are their own.
exclude = ["target"]

[package]
name = "myos"
version = "0.1.0"
edition = "2024"
description = "A small kernel that boots in QEMU on x86_64 and AArch64 via Limine."
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
ovmf-prebuilt = "0.2.9"
# The boot disk's ESP and data partition (src/limine_disk.rs), built by the
# launcher and build.rs alike.
fatvol = { path = "modules/fat/fatvol" }
ext2fs = { path = "modules/ext2/ext2fs" }

# What the image carries is not a feature set: every port whose directory is
# under ports/ (and the user/ programs) is built and packed; a directory under
# packages/ is built and published for `get-myos` instead (docs/ports.md).
[features]
default = []

# Optional Linux syscall compatibility layer (see docs/linux-compat.md): the
# kernel module (modules/linux) is always built; this feature loads it at
# boot and adds the musl test binaries to the image (the `linux` launcher
# ships regardless; get-alpine is a package, packages/get-alpine).
linux_compat = []

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
fatvol = { path = "modules/fat/fatvol" }
ext2fs = { path = "modules/ext2/ext2fs" }

[profile.dev]
panic = "abort"

# The kernel runs under QEMU TCG in CI, where unoptimized code is several
# times slower. Optimize it even in dev builds; debug assertions and
# overflow checks stay on (they are separate profile settings).
[profile.dev.package.kernel]
opt-level = 2

[profile.release]
panic = "abort"
