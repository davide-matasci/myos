[workspace]

[package]
name = "wifi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Wi-Fi: the daemon (scan, association, WPA2-PSK) and its command."

[[bin]]
name = "wifi"
test = false
bench = false

[dependencies]
myos-user = { path = "../lib" }
iwx = { path = "iwx" }
mtw = { path = "mtw" }
bwfm = { path = "bwfm" }
wpa = { path = "wpa" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
