[workspace]

[package]
name = "mkfs-ext2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Userspace mkfs.ext2: format a block device as ext2 (the ext2fs crate)"

[[bin]]
name = "mkfs_ext2"
path = "src/main.rs"
test = false
bench = false

[dependencies]
myos-user = { path = "../lib" }
ext2fs = { path = "../../modules/ext2/ext2fs" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
