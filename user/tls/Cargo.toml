[workspace]

[package]
name = "myos-tls"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reusable TLS client (mbedtls FFI) for myos userspace; /net/tls can adopt later."

[lib]
name = "myos_tls"
path = "src/lib.rs"

[dependencies]
myos-user = { path = "../lib" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
