[workspace]

[package]
name = "sh"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal myos shell (serial stdin)."

[[bin]]
name = "sh"
test = false
bench = false

[dependencies]
myos-user = { path = "../lib" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
