[workspace]

[package]
name = "netd"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Userspace netd: smoltcp over /dev/net0, Plan 9 /net via /dev/netd."

[[bin]]
name = "netd"
test = false
bench = false

[dependencies]
myos-user = { path = "../lib" }
myos-net = { path = "../net" }

# smoltcp with myos's patches (user/net/smoltcp), which kernel/build.rs
# prepares before it builds netd (PORT_PREPARE).
[patch.crates-io]
smoltcp = { path = "../../target/smoltcp-myos" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
