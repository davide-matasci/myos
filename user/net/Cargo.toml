[workspace]

[package]
name = "myos-net"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Userspace smoltcp Device over /dev/net0, reusable by netd."

[lib]
name = "myos_net"
path = "src/lib.rs"

[dependencies]
myos-user = { path = "../lib" }
smoltcp = { version = "=0.12.0", default-features = false, features = [
  "alloc",
  "medium-ethernet",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "proto-dhcpv4",
  "proto-dns",
  "socket-icmp",
  "socket-udp",
  "socket-tcp",
  "socket-dhcpv4",
  "socket-dns",
  # The loopback interface carries 127.0.0.1, ::1 and every NIC's
  # addresses (the multi-home patch), a NIC its IPv4 one, its link-local
  # and its SLAAC one: room for two NICs' three.
  "iface-max-addr-count-8",
] }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
