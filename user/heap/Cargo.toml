[workspace]

[package]
name = "heap"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Heavy boot-test smoke (std/C/sbase/uutils/ripgrep/tcc/bigalloc/git); run by user/tests/shell.sh."

[[bin]]
name = "heap"
test = false
bench = false

[dependencies]
myos-user = { path = "../lib" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
