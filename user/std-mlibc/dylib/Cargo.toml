# Rust shared objects on the mlibc flavour (docs/userspace.md "`std` on
# mlibc"): `rt`, a dylib that holds std; `plugin`, a dylib over it that
# the program loads with dlopen; `host`, the program, over `rt` too.
[workspace]
members = ["rt", "plugin", "host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
