[workspace]

[package]
name = "myos-user"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Userspace syscall wrappers for myos."

[lib]
name = "myos_user"
path = "src/lib.rs"

[dependencies]
# The syscall failure values (`MYOS_SYSERR_LOWEST`), the kernel's own.
myos-abi = { path = "../../modules/abi" }

[profile.dev]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"

[profile.release]
panic = "abort"
opt-level = "s"
debug = false
strip = "debuginfo"
