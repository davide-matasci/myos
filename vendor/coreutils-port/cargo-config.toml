[unstable]
json-target-spec = true

[env]
MYOS_SYSROOT = { value = "../../target/myos-sysroot", relative = true }
RUSTC_BOOTSTRAP = "1"

[build]
rustc = "../../scripts/myos-rustc-cross.sh"
# uutils release profile sets lto=fat; myos sysroot + static-pie fails LTO bitcode merge.
rustflags = ["-C", "panic=abort", "-C", "lto=off"]

[target.x86_64-unknown-myos]
linker = "rust-lld"

[target.aarch64-unknown-myos]
linker = "rust-lld"

[profile.release]
lto = false

[patch.crates-io]
errno = { path = "../../target/patched-crates/errno-0.3.14" }
libc = { path = "../../target/patched-crates/libc-0.2.189" }
rustix = { path = "../../vendor/myos-rustix-stub" }
