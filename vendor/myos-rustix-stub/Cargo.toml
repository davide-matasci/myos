[package]
name = "rustix"
version = "1.1.4"
edition = "2021"
publish = false
description = "Minimal rustix stub for myos coreutils porting"

[features]
default = ["std"]
std = []
alloc = []
all-apis = []
event = []
fs = []
io = []
io_uring = []
linux_4_11 = []
linux_5_1 = []
linux_5_11 = []
linux_latest = []
mm = []
mount = []
net = []
param = []
pipe = []
process = []
pty = []
rand = []
runtime = []
shm = []
stdio = []
system = []
termios = []
thread = []
time = []
try_close = []
use-explicitly-provided-auxv = []
use-libc = []
use-libc-auxv = []

[lib]
path = "lib.rs"
