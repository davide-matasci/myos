[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
linked_list_allocator = "0.10.5"
spin = "0.9.8"
myos-abi = { path = "../modules/abi" }
limine = "0.6.5"
# Flattened device tree parser (aarch64 / riscv64 board description), MPL-2.0.
fdt = "0.1.5"
# zstd decoder for the compressed initramfs and tests module (fs/zstd.rs),
# MIT; its `hash` feature (twox-hash, MIT) checks the frames' checksums.
ruzstd = { version = "0.9.1", default-features = false, features = ["hash"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Not the crate's `nightly` feature set: its `step_trait` implements the
# `Step` methods of one nightly's library, which other compilers (Alpine's
# rustc, building myos inside myos) do not have. The kernel needs only the
# `x86-interrupt` ABI.
x86_64 = { version = "0.15.2", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
pic8259 = "0.11.0"
