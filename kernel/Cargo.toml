[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
linked_list_allocator = "0.10.5"
spin = "0.9.8"
myos-abi = { path = "../modules/abi" }
# Normal artifact dep (not build-dep): same profile as the kernel, so
# panic=abort. Build-deps get panic=unwind and cargo forbids overriding it.
hello = { path = "../modules/hello", artifact = "bin:hello" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.2"
pic8259 = "0.11.0"
