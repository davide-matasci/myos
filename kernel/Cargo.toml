[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# Optional Linux syscall compatibility layer (kernel/src/linux/, see
# docs/linux-compat.md). Off by default: without it the kernel has no Linux
# code at all. Enabled from the root package's `linux_compat` feature.
linux-compat = []

[dependencies]
linked_list_allocator = "0.10.5"
spin = "0.9.8"
myos-abi = { path = "../modules/abi" }
limine = "0.6.5"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.2"
pic8259 = "0.11.0"
ps2-scancode = { path = "../ps2-scancode" }
