[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
linked_list_allocator = "0.10.5"
spin = "0.9.8"
myos-abi = { path = "../modules/abi" }
limine = "0.6.5"
# Flattened device tree parser (aarch64 / riscv64 board description), MPL-2.0.
fdt = "0.1.5"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.2"
pic8259 = "0.11.0"
